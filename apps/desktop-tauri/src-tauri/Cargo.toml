[package]
name = "falconshot-desktop"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
image.workspace = true
tokio.workspace = true
capture-core = { path = "../../../crates/capture-core" }
overlay-core = { path = "../../../crates/overlay-core" }
floating-core = { path = "../../../crates/floating-core" }
annotation-core = { path = "../../../crates/annotation-core" }
image-core = { path = "../../../crates/image-core" }
clipboard-core = { path = "../../../crates/clipboard-core" }
hotkey-core = { path = "../../../crates/hotkey-core" }
ocr-core = { path = "../../../crates/ocr-core" }
privacy-core = { path = "../../../crates/privacy-core" }
storage-core = { path = "../../../crates/storage-core" }
settings-core = { path = "../../../crates/settings-core" }
platform-windows = { path = "../../../platform/windows" }
urlencoding = "2"
sys-locale = "0.3"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging"] }
tauri-plugin-global-shortcut = "2.3.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
